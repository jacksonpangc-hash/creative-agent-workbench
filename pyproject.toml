[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "creative-material-agent"
version = "0.5.5"
description = "Local, BYOK ecommerce creative strategy agent"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "keyring>=25,<26", "python-multipart>=0.0.20", "pillow>=11,<13", "rapidfuzz>=3,<4", "reportlab>=4,<5", "openpyxl>=3.1,<4", "imageio-ffmpeg>=0.6,<1", "cryptography>=44,<45", "yt-dlp>=2026.10.21,<2027", "fastembed==0.7.3", "qdrant-client==1.15.1", "onnxruntime==1.23.2", "tokenizers==0.23.3"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
license-service = ["psycopg[binary]>=3.2,<4"]
transcription = ["faster-whisper>=1.2,<2"]
team = ["psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "cryptography>=44,<45"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
creative-agent = "creative_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["local_model: actual offline FastEmbed/Qdrant delivery check"]

[tool.ruff]
target-version = "py312"
line-length = 110

