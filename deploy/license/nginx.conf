events { worker_connections 1024; }
http {
  access_log off;
  limit_req_zone $binary_remote_addr zone=license_requests:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=license_login:10m rate=6r/m;
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(admin/login|v1/login)$ {
      limit_req zone=license_login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://licensing:8000;
      proxy_set_header Host $host;
      proxy_read_timeout 15s;
    }
    location / {
      limit_req zone=license_requests burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://licensing:8000;
      proxy_set_header Host $host;
      proxy_read_timeout 15s;
    }
  }
}
