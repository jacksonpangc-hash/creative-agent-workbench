services:
  proxy:
    volumes:
      - ./Caddyfile.identity:/etc/caddy/Caddyfile:ro
  # Optional customer-operated identity provider. Configure the creative realm
  # and public client via the documented operator flow; never ship user accounts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_HOSTNAME: https://${OIDC_HOST:-identity.example.invalid}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set separate Keycloak database password for identity profile}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set Keycloak bootstrap password for identity profile}
    networks: [team]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped