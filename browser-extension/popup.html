<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保存参考</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--text:#20242c;--muted:#5f6674;--border:#e2e5ec;--accent:#6254d8;--danger:#b42318}*{box-sizing:border-box}body{width:380px;margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}h2{font-size:20px;line-height:1.3;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}p{margin:10px 0}input,textarea,select,button{font:inherit;color:inherit;border:1px solid var(--border);border-radius:8px}input,textarea,select{display:block;width:100%;padding:10px;background:var(--surface);margin-top:6px}textarea{resize:vertical;min-height:92px}button{width:100%;min-height:42px;padding:8px 12px;background:var(--surface);cursor:pointer;margin:6px 0}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{color:var(--muted);background:#eceef2;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}small,.muted{color:var(--muted);font-size:13px}label{display:block;margin:10px 0}summary{cursor:pointer;min-height:32px;padding-top:6px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status[data-error=true]{color:var(--danger)}#items{max-height:240px;overflow:auto}#items label{display:flex;gap:10px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px}#items input{width:18px;min-height:18px;flex-shrink:0;margin:3px 0}#items span{overflow-wrap:anywhere}#paired{padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:8px}section+section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}[hidden]{display:none!important}
</style>
<h2>保存参考</h2>
<p class="muted">主动读取当前抖音、快手网页，选择要保存到项目的参考。</p>
<section id="connection">
 <h3>连接创意工作台</h3>
 <p id="connection-status" role="status">正在检查连接…</p>
 <button id="connect" class="primary">连接创意工作台</button>
 <small>首次连接后，在桌面“设置 → 参考来源”确认一次。</small>
 <label>保存到项目<select id="project" aria-label="保存到项目"></select></label>
 <details><summary>连接遇到问题</summary><button id="open-desktop">打开桌面应用</button><small>若公司设备限制安装，请联系设备管理员。也可在桌面粘贴链接或导入文件。</small></details>
 <button id="disconnect" hidden>撤销此浏览器连接</button>
</section>
<section>
 <button id="capture">读取当前页面</button>
 <div id="items"></div>
 <button id="import" class="primary" disabled>保存选中的参考</button>
 <small>仅读取本页可见标题、作者、链接和互动原文，不读取 Cookie、登录凭证或其他标签页。保存链接不会自动获取视频。</small>
</section>
<p id="status" role="status" aria-live="polite"></p>
<button id="receipt" hidden>查询上次保存回执</button>
<button id="view" hidden>在创作台查看</button>
<script type="module" src="popup.js"></script>
</html>
